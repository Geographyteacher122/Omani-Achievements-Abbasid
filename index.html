<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B0F18">
<title>المنجزات الحضارية العمانية في العصر العباسي الأول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>:root{--paper:#fbf3dc;--parch:#f1e2b8;--ink:#4a3220;--sepia:#8a5a2b;--gold:#c58a1b;--wax:#a8322d;--wax2:#6e1f1b;--teal:#0e5a6b;--sea:#7fc4d8;--olive:#5f7a3a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif}
html,body{height:100%;margin:0}
body{background:#e9d6a6 radial-gradient(120% 90% at 50% 0%,#f6e9c4,#e6d09a 70%,#d9bf86);color:var(--ink);overflow:hidden;-webkit-user-select:none;user-select:none}
button{font-family:inherit}
#app{height:100dvh;display:flex;flex-direction:column}
.hud{flex:none;display:flex;align-items:center;gap:10px;padding:6px 14px;background:linear-gradient(#f9efd0,#ecd9a6);border-bottom:3px double var(--sepia);box-shadow:0 4px 14px rgba(74,50,32,.25)}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto;min-width:0}
.brand h1{margin:0;font-size:clamp(17px,2.5vw,26px);font-weight:900;line-height:1.15;color:var(--ink)}
.brand small{display:block;font-size:clamp(12px,1.5vw,15px);font-weight:700;color:var(--sepia)}
.seal{display:grid;place-items:center;min-width:58px;padding:3px 10px;border-radius:999px;background:radial-gradient(circle at 35% 30%,#e0a53a,var(--wax) 55%,var(--wax2));color:#fff3d6;box-shadow:0 3px 0 var(--wax2),0 5px 10px rgba(74,50,32,.35);text-align:center}
.seal b{display:block;font-size:20px;font-weight:900;line-height:1.1}.seal span{font-size:11.5px;font-weight:700;opacity:.9}
.hbtn{appearance:none;border:2px solid var(--sepia);background:var(--paper);color:var(--ink);border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer}
.main{flex:1;min-height:0;display:grid;grid-template-columns:clamp(330px,34vw,440px) minmax(0,1fr);gap:14px;padding:12px 14px 4px}
.panel{min-height:0;display:flex;flex-direction:column;gap:12px}
.prog{flex:none;display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.prog i{width:20px;height:20px;border-radius:50%;border:2px solid var(--sepia);background:rgba(255,255,255,.4);position:relative}
.prog i.done{background:radial-gradient(circle at 35% 30%,#e0a53a,var(--wax) 55%,var(--wax2));border-color:var(--wax2);animation:stamp .5s cubic-bezier(.3,1.6,.5,1) both}
.prog i.done::after{content:'★';position:absolute;inset:0;display:grid;place-items:center;font-size:11px;color:#ffe9b0;font-style:normal}
.prog i.cur{background:#fff3c4;border-color:var(--gold);animation:pul 1.3s infinite}
@keyframes pul{50%{box-shadow:0 0 0 5px rgba(197,138,27,.35)}}
@keyframes stamp{from{transform:scale(2.2) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
.qcard{position:relative;margin:14px 4px 0;background:linear-gradient(180deg,#fdf6e1,#f3e4bb);border-radius:6px;padding:22px 16px 18px;display:flex;flex-direction:column;gap:11px;box-shadow:0 12px 26px rgba(74,50,32,.35),inset 0 0 0 2px rgba(138,90,43,.35);transform-origin:top;animation:unroll .55s cubic-bezier(.2,.9,.3,1) both}
.qcard::before,.qcard::after{content:'';position:absolute;left:-10px;right:-10px;height:20px;border-radius:10px;background:linear-gradient(#8a5a2b,#e8c98c 45%,#9b6a32 75%,#6b4423);box-shadow:0 3px 6px rgba(0,0,0,.3)}
.qcard::before{top:-13px}.qcard::after{bottom:-13px}
@keyframes unroll{from{transform:scaleY(.15);opacity:0}to{transform:none;opacity:1}}
.pill{display:inline-flex;padding:3px 16px;border-radius:999px;background:var(--teal);color:#ffeab8;font-weight:800;font-size:15px;box-shadow:0 2px 0 #08404b}
.badge{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.q{font-size:clamp(20px,3vh,27px);font-weight:900;line-height:1.7;color:var(--ink);padding:4px 2px}
.q b{color:var(--wax)}
.hintbox{font-size:17px;font-weight:700;color:#5a4306;background:#fff0c2;border:1.5px dashed var(--gold);border-radius:10px;padding:6px 12px}
.btn{appearance:none;border:0;border-radius:999px;padding:11px 20px;font-weight:900;font-size:18px;cursor:pointer;color:#fff3d6;background:radial-gradient(circle at 35% 25%,#e0a53a,var(--wax) 55%,var(--wax2));box-shadow:0 4px 0 var(--wax2),0 8px 14px rgba(74,50,32,.3);transition:transform .12s}
.btn:active{transform:translateY(2px)}
.btn.gold{background:linear-gradient(135deg,#f4c64d,#c58a1b);color:#3b2a05;box-shadow:0 4px 0 #8a5d0c,0 8px 14px rgba(74,50,32,.3)}
.btn.ghost{background:var(--paper);color:var(--ink);box-shadow:0 3px 0 #b99a5e;border:1.5px solid #c9ac72}
.btn.small{padding:5px 14px;font-size:15px}
.btn:disabled{opacity:.5}
.note{font-size:14.5px;font-weight:700;color:#7d6538;text-align:center}
.stars{display:flex;justify-content:center;gap:6px}.stars svg{width:44px;height:44px}
.stars svg path{fill:#e5d8b2;stroke:#c9b27a;stroke-width:2}.stars svg.on path{fill:var(--gold);stroke:#8a5d0c}
.fact{font-size:clamp(17px,2.4vh,21px);font-weight:700;line-height:1.85;color:var(--ink);background:rgba(255,255,255,.55);border-radius:10px;padding:10px 14px;box-shadow:inset 0 0 0 1.5px #dcc58c}
.autonote{font-size:14px;font-weight:700;color:#8a7647;text-align:center}
.wrapS{position:relative;min-width:0;min-height:0}
.stage{position:absolute;inset:0;margin:auto;border-radius:12px;overflow:hidden;background:var(--sea);touch-action:none;box-shadow:0 0 0 4px #e9d4a2,0 0 0 7px var(--sepia),0 0 0 9px #e9d4a2,0 14px 34px rgba(74,50,32,.5)}
.stage::after{content:'';position:absolute;inset:7px;border:1.5px solid rgba(107,68,35,.5);border-radius:8px;pointer-events:none;z-index:3}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
#map.drawing{cursor:crosshair}
.land{fill:#efe0b0;stroke:#a07f3f;stroke-width:.7;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.land:hover{fill:#f6e9c2}
.halo{fill:none;stroke:#d6f1f7;stroke-width:8;stroke-opacity:.5;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.lb{pointer-events:none}
.zb{position:absolute;bottom:14px;inset-inline-start:14px;z-index:4;display:flex;flex-direction:column;gap:8px}
.zb button{width:42px;height:42px;border-radius:50%;border:2px solid var(--sepia);background:var(--paper);color:var(--ink);font-size:21px;font-weight:900;cursor:pointer;box-shadow:0 3px 0 #b99a5e}
.rose{position:absolute;top:12px;inset-inline-start:14px;z-index:4;width:78px;height:78px;pointer-events:none;filter:drop-shadow(0 3px 5px rgba(74,50,32,.45))}
.rose .sp{transform-origin:50% 50%;animation:spin 90s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.rose .nd{transform-origin:50% 50%;animation:nd 6s ease-in-out infinite}@keyframes nd{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
.scalebar{position:absolute;z-index:4;bottom:14px;inset-inline-end:16px;color:var(--ink);font-weight:800;font-size:12.5px;text-align:center;pointer-events:none;text-shadow:0 0 4px #fff,0 0 4px #fff}
.scalebar i{display:block;height:7px;border:2.5px solid var(--ink);border-top:0;margin:0 auto 2px}
#toast{position:absolute;top:14px;left:50%;transform:translate(-50%,-8px);z-index:5;max-width:86%;padding:8px 20px;border-radius:999px;background:var(--paper);color:var(--ink);border:2px solid var(--sepia);font-weight:800;font-size:clamp(15px,2vh,18px);opacity:0;transition:.3s;pointer-events:none;text-align:center;box-shadow:0 6px 14px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.bad{background:#F3DDB8;border-color:var(--wax)}#toast.ok{background:#e3f1d0;border-color:var(--olive)}
footer{flex:none;text-align:center;padding:2px 10px 6px;font-size:15px;font-weight:800;color:var(--sepia)}
.rng{display:inline-flex;direction:rtl;unicode-bidi:isolate;white-space:nowrap}
.sealm .pop{transform-box:fill-box;transform-origin:center;animation:stamp .55s cubic-bezier(.3,1.6,.5,1) both}
.sealm .rip{transform-box:fill-box;transform-origin:center;animation:rip 2.4s ease-out infinite}@keyframes rip{from{transform:scale(.6);opacity:.8}to{transform:scale(2.4);opacity:0}}
.far .sealm text{display:none}
/* overlays */
.overlay{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:12px;overflow:auto}
.overlay.hidden{display:none}
#intro{background:#d9c08a;padding:0}
#intro .bgimg{position:absolute;inset:0;background-size:cover;background-position:50% 55%;animation:kb 30s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07) translateX(1%)}}
#intro .glow{position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,244,205,.35) 50%,transparent 65%);background-size:250% 100%;animation:sweep 9s ease-in-out infinite}
@keyframes sweep{from{background-position:130% 0}to{background-position:-30% 0}}
#intro .scrim{position:absolute;inset:0;background:radial-gradient(ellipse 52% 50% at 50% 38%,rgba(251,243,220,.55),rgba(251,243,220,0) 70%),linear-gradient(180deg,rgba(0,0,0,0) 62%,rgba(10,30,45,.55) 100%)}
.ic2{position:relative;z-index:2;width:100%;height:100%;max-width:1000px;margin:0 auto;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;padding:clamp(20px,9vh,90px) 18px clamp(12px,3vh,26px)}
.ic2 .lesson{display:inline-block;padding:3px 20px;border-radius:999px;border:2px solid var(--sepia);background:rgba(251,243,220,.85);color:var(--ink);font-weight:900;font-size:clamp(15px,2.6vh,21px)}
.ic2 h2{margin:12px 0 0;color:var(--ink);font-weight:900;line-height:1.2;font-size:clamp(30px,8.2vh,76px);text-shadow:0 2px 0 rgba(255,244,210,.9),0 0 22px rgba(255,244,210,.95)}
.ic2 h2 .l2{display:block;font-size:.66em;color:var(--wax2)}
.ink{display:block;clip-path:inset(0 0 0 100%);animation:inkr 1.6s .3s cubic-bezier(.3,.7,.2,1) forwards}.ink.d2{animation-delay:1.1s}
@keyframes inkr{to{clip-path:inset(0 0 0 0)}}
.ic2 .btn{margin:14px 0 6px;font-size:clamp(19px,3.2vh,26px);padding:13px 46px}
.ic2 .credit{font-weight:900;font-size:clamp(16px,2.8vh,24px);color:#fff3d6;text-shadow:0 2px 8px rgba(0,0,0,.9),0 0 3px #000;line-height:1.55}
.ic2 .credit .c1,.ic2 .credit .c2{display:block}.ic2 .credit .sep{display:none}
.card{width:min(560px,100%);max-height:calc(100dvh - 24px);overflow:auto;background:linear-gradient(180deg,#fdf6e1,#f1e2b8);border:4px double var(--sepia);border-radius:18px;padding:18px;text-align:center;box-shadow:0 30px 70px rgba(0,0,0,.5)}
#end{background:rgba(40,25,10,.7);backdrop-filter:blur(5px)}
.card h2{margin:0 0 4px;font-size:28px;font-weight:900;color:var(--ink)}
.res{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.res div{background:#fff;border:1px solid #dcc58c;border-radius:12px;padding:6px}.res b{display:block;font-size:23px;font-weight:900;color:var(--wax)}.res span{font-size:13px;color:#6b5a38}
.nameIn{width:100%;padding:11px 14px;border-radius:12px;border:2px solid #c9ac72;font:inherit;font-weight:800;font-size:19px;text-align:center;background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text;margin:6px 0 10px}
.endbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}.endbtns .btn{flex:1;min-width:130px}
.credit2{margin-top:10px;font-weight:800;font-size:15px;color:var(--ink);border-top:2px dashed #c9a24a;padding-top:8px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
@media (max-width:860px),(max-aspect-ratio:1/1){
  .main{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);padding:10px 12px 4px;gap:12px}
  .wrapS{order:-1;aspect-ratio:var(--ar);width:100%}
  .q{font-size:19px}.brand small{display:none}.brand h1{font-size:16px}.seal{min-width:50px;padding:2px 8px}.seal b{font-size:17px}
  footer .sep{display:none}footer .c1,footer .c2{display:block}footer{font-size:14px}
  .rose{width:52px;height:52px;top:8px}
  .ic2 h2{font-size:clamp(28px,9vw,44px)}.ic2 .credit{font-size:clamp(15px,4.2vw,20px)}
}
@media (max-height:520px) and (min-width:700px){.q{font-size:17px}.qcard{padding:16px 12px 14px;gap:7px}footer{font-size:12px;padding:0 10px 2px;line-height:1.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.guide{flex:1 1 0;min-height:0;display:flex;align-items:flex-end;justify-content:center;position:relative;margin-top:-4px}
.guide::before{content:"";position:absolute;bottom:2px;left:50%;width:46%;height:14px;transform:translateX(-50%);background:radial-gradient(ellipse,rgba(74,50,32,.28),transparent 70%)}
.guide img{max-height:100%;max-width:100%;width:auto;height:auto;object-fit:contain;position:relative;animation:bob 3.2s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(.8deg)}}
@media (max-height:520px){.guide{display:none}}
@media (max-width:860px),(max-aspect-ratio:1/1){
  .main{gap:8px}
  .panel{gap:8px;overflow-y:auto;overflow-x:hidden;padding-bottom:6px}
  .prog{gap:3px}.prog i{width:17px;height:17px;border-width:1.5px}.prog i.done::after{font-size:9px}
  .qcard{margin:12px 6px 14px;padding:14px 12px 12px;gap:7px}
  .q{font-size:clamp(17px,4.6vw,21px);line-height:1.55;padding:0}
  .note{font-size:12.5px;line-height:1.5}
  .qcard .btn.small,.badge .btn{padding:3px 12px;font-size:14px}
  .stars svg{width:34px;height:34px}
  .fact{font-size:16px;padding:8px 12px;line-height:1.7}
  footer{padding:2px 10px 8px;font-size:13px;line-height:1.35}
  .guide{min-height:0}
}
.guide{container-type:size}
@container (max-height:120px){.guide img,.guide::before{display:none}}
.land.hi{stroke-width:1}
#draw path{fill:none;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.ref{fill:none;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;stroke-dasharray:1;stroke-dashoffset:0;animation:rdraw 4s ease-in-out both}
@keyframes rdraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.ref2{fill:none;stroke:#fff;stroke-width:1.6;stroke-dasharray:3 9;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.85}
.rbtns{display:flex;gap:10px}.rbtns .btn{flex:1;padding:8px 12px;font-size:17px}
.drawing{cursor:crosshair!important}
/* ===== حركة الصفحة الرئيسية ===== */
.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.scene .tw{transform-box:fill-box;transform-origin:center;animation:twk 3s ease-in-out infinite}
@keyframes twk{0%,100%{opacity:.05;transform:scale(.5)}50%{opacity:1;transform:scale(1.25)}}
.scene .drift{animation:driftx 120s linear infinite}
@keyframes driftx{from{transform:translateX(-500px)}to{transform:translateX(1900px)}}
.scene .driftA{animation:driftxA 100s linear infinite}
@keyframes driftxA{from{transform:translateX(-500px)}to{transform:translateX(1500px)}}
.scene .fly{animation:flyx 40s linear infinite}
@keyframes flyx{from{transform:translate(-200px,30px)}to{transform:translate(1800px,-50px)}}
.scene .bob{transform-box:fill-box;transform-origin:50% 90%;animation:bob2 4.2s ease-in-out infinite}
@keyframes bob2{0%,100%{transform:translateY(0) rotate(-1.4deg)}50%{transform:translateY(6px) rotate(1.4deg)}}
.scene .sailA{animation:sailA 70s linear infinite}
@keyframes sailA{0%{transform:translateX(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translateX(420px);opacity:0}}
.scene .sailB{animation:sailB 120s linear infinite}
@keyframes sailB{from{transform:translateX(-900px)}to{transform:translateX(1900px)}}
.scene .mote{animation:moteUp 10s linear infinite;transform-box:fill-box}
@keyframes moteUp{0%{transform:translate(0,40px);opacity:0}15%{opacity:.9}100%{transform:translate(30px,-260px);opacity:0}}
.scene .sunp{transform-box:fill-box;transform-origin:center;animation:sunp 5s ease-in-out infinite}
@keyframes sunp{0%,100%{opacity:.75;transform:scale(.94)}50%{opacity:1;transform:scale(1.08)}}
.scene .sunc{transform-box:fill-box;transform-origin:center;animation:sunp 5s ease-in-out infinite}
.scene .rays{transform-box:view-box;transform-origin:1280px 330px;animation:spinr 80s linear infinite}
@keyframes spinr{to{transform:rotate(360deg)}}
.ic2 .btn{animation:bpulse 2.4s ease-in-out infinite}
@keyframes bpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.ic2 .lesson{animation:floaty 4s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media (max-width:860px){.brand h1{font-size:14.5px;line-height:1.25}}
/* ===== خطوط التجارة: خريطة بحرية نهارية، أزرق وبحري ===== */
:root{--paper:#ffffff;--parch:#eaf6f8;--ink:#2B0F18;--sepia:#6B1F33;--gold:#e08a1e;--gold2:#b5650a;--wax:#D9961A;--wax2:#9a6410;--teal:#2B0F18;--sea:#ecd9aa;--ar:1.4697}
body{background:#FBF0DC linear-gradient(180deg,#FFF8EC,#F3DDB8);color:var(--ink)}
.hud{background:#fff;border-bottom:0;box-shadow:0 6px 0 #2B0F18,0 10px 22px rgba(43,15,24,.25);position:relative;z-index:3}
.brand h1{color:#2B0F18}.brand small{color:#6B1F33}
.seal{border-radius:14px 14px 14px 4px;background:#2B0F18;color:#fff;box-shadow:0 3px 0 #1a0810;padding:3px 14px}.seal b{color:#ffe08a}
.hbtn{background:#fff;border:2px solid #2B0F18;color:#2B0F18}
.prog i{border:2px solid #2B0F18;background:#fff;border-radius:50%;width:19px;height:19px}
.prog i.done{background:#D9961A;border-color:#9a6410;animation:stamp .5s cubic-bezier(.3,1.6,.5,1) both}.prog i.done::after{content:'⚓';font-size:11px;color:#fff}
.prog i.cur{background:#ffe08a;border-color:#e08a1e;animation:pul 1.3s infinite}
.qcard{margin:6px 4px 0;background:#fffdf6 repeating-linear-gradient(180deg,transparent 0 31px,rgba(107,31,51,.13) 31px 32px);border-radius:6px 16px 16px 6px;padding:20px 18px 16px 18px;border-right:6px solid #D9961A;box-shadow:0 0 0 2px #2B0F18,6px 8px 0 #2B0F18,0 16px 30px rgba(43,15,24,.28);animation:slideIn .55s cubic-bezier(.2,.9,.3,1) both;transform-origin:right center}
.qcard::before,.qcard::after{display:none}
@keyframes slideIn{from{transform:translateX(40px) rotate(1.6deg);opacity:0}to{transform:none;opacity:1}}
.pill{background:#2B0F18;color:#ffe08a;box-shadow:none;border-radius:8px}
.q{color:#2B0F18}.q b{color:#D9961A}
.note{color:#6b4a4f}.autonote{color:#6b4a4f}
.hintbox{background:#fff3d2;color:#6a4306;border-color:#e08a1e}
.btn{background:#D9961A;color:#fff;box-shadow:0 4px 0 #9a6410,0 8px 14px rgba(43,15,24,.25);border-radius:12px}
.btn.gold{background:#ffe08a;color:#4a2f04;box-shadow:0 4px 0 #b5850f}
.btn.ghost{background:#fff;color:#2B0F18;border:2px solid #2B0F18;box-shadow:0 3px 0 #2B0F18}
.stars svg path{fill:#dbe8ee;stroke:#b3c9d4}.stars svg.on path{fill:#ffb703;stroke:#b5650a}
.fact{background:#fff;color:#2B0F18;box-shadow:inset 0 0 0 2px #FBF0DC}
.stage{background:var(--sea);border-radius:14px;box-shadow:0 0 0 4px #fff,0 0 0 9px #2B0F18,0 0 0 11px #fff,0 0 0 14px #D9961A,0 18px 34px rgba(43,15,24,.45)}
.stage::after{border:1.5px dashed rgba(43,15,24,.4);border-radius:9px}
.land{fill:#f8f0d8;stroke:#7a8a8f;stroke-width:.6}.land:hover{fill:#fff7e0}
.halo{stroke:#ffffff;stroke-opacity:.55}
.zb button{background:#fff;color:#2B0F18;border:2px solid #2B0F18;box-shadow:0 3px 0 #2B0F18}
.scalebar{color:#2B0F18;text-shadow:0 0 5px #fff,0 0 5px #fff}.scalebar i{border-color:#2B0F18}

  $('routes').insertAdjacentHTML('beforeend',`<path class="ref" pathLength="1" d="${d}" style="stroke:${c}"/><path class="ref2" d="${d}"/>`);
  $('marks').insertAdjacentHTML('beforeend',`<g id="shipM${qi}"><animateMotion dur="4s" fill="freeze" calcMode="linear" path="${d}"/><g class="lb" data-x="0" data-y="0" data-k=".55"><g transform="translate(0 -4)">${CFG.shipSym}</g></g></g>`);applyCam();
  const e=q.route.end;mk(CFG.mark(q.route.endName||'',false),e[0],e[1],.8,'m'+qi);
}
async function correct(q,after,wait){
  locked=true;phase='fact';
  const n=Math.max(1,3-tries-(hint?1:0));stars+=n;score+=n*100;sfx.ok();toast('أحسنت! إجابة صحيحة 🎉','ok');
  clearTemp();after&&after();hud();confettiBurst(innerWidth/2,innerHeight/3,36);
  card.innerHTML=`<div class="badge"><span class="pill">${q.p} (${AR(qi+1)}/${AR(Q.length)})</span></div>${starRow(n)}
  <div style="text-align:center;font-weight:900;color:var(--gold2);font-size:16px">+${AR(n*100)} نقطة</div>
  <div class="fact">${q.f}</div><div class="autonote">ننتقل للسؤال التالي تلقائيًا…</div>`;replay();
  await sleep(wait||2800);qi++;showQ();
}
function finish(){phase='end';locked=true;clearTemp();fit();hud();sfx.fan();setTimeout(()=>{confettiBurst(innerWidth/2,innerHeight/3,140);showEnd()},1500)}
function grade(){const r=stars/MAXS();return r>=.85?['مستكشف بارع','🏅']:r>=.65?['مستكشف متمكّن','🥈']:r>=.4?['مستكشف مجتهد','🥉']:['بداية موفّقة، أعد المحاولة لتجمع نجومًا أكثر','🌱']}
function showEnd(){
  const e=$('end');e.classList.remove('hidden');const [g,ic]=grade();
  $('endCard').innerHTML=`<h2>${ic} أحسنت!</h2><p style="margin:2px 0;font-weight:700;font-size:18px">${g}</p>
  <div class="res"><div><b>${AR(stars)}/${AR(MAXS())}</b><span>النجوم</span></div><div><b>${AR(score)}</b><span>النقاط</span></div></div>
  <div style="font-weight:700;font-size:17px">اكتب اسمك لتحصل على الشهادة:</div>
  <input id="nameIn" class="nameIn" maxlength="30" placeholder="اسم الطالب/ة" autocomplete="off">
  <div class="endbtns"><button class="btn gold" id="certBtn">💾 حفظ الشهادة (صورة)</button><button class="btn ghost" id="againBtn">العب مرة أخرى</button><button class="btn ghost" id="viewBtn">شاهد الخريطة</button></div>
  <div class="credit2">إعداد: أ. عهود العبرية - مدرسة وادي غول للتعليم الأساسي <span style="white-space:nowrap">(<span class="rng" dir="rtl"><span>1</span><span>-</span><span>9</span></span>)</span></div>`;
  $('certBtn').onclick=saveCert;$('againBtn').onclick=()=>{e.classList.add('hidden');start()};$('viewBtn').onclick=()=>e.classList.add('hidden');
  $('nameIn').addEventListener('keydown',ev=>{if(ev.key==='Enter')saveCert()});
}
function saveCert(){
  const v=($('nameIn').value||'').trim();if(!v){$('nameIn').focus();return}
  const C=CFG.cert,W=1600,H=1130,cv=document.createElement('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');const F="Tajawal,Cairo,Tahoma,Arial,sans-serif";
  x.fillStyle=C.bg;x.fillRect(0,0,W,H);x.strokeStyle=C.frame;x.lineWidth=10;x.strokeRect(40,40,W-80,H-80);x.lineWidth=3;x.strokeRect(62,62,W-124,H-124);
  x.direction='rtl';x.textAlign='center';x.textBaseline='middle';const [g,ic]=grade();
  const T=(t,y,sz,col,w)=>{x.font=`${w||800} ${sz}px ${F}`;x.fillStyle=col;x.fillText(t,W/2,y)};
  T(ic,170,90,'#000');T('شهادة مستكشف',290,86,C.title);T('تُمنح هذه الشهادة للطالب/ة',385,38,C.text,600);
  let sz=100;x.font=`900 ${sz}px ${F}`;while(x.measureText(v).width>1100&&sz>40){sz-=4;x.font=`900 ${sz}px ${F}`}
  T(v,495,sz,C.name,900);x.strokeStyle=C.line;x.setLineDash([12,10]);x.lineWidth=3;x.beginPath();x.moveTo(300,555);x.lineTo(1300,555);x.stroke();x.setLineDash([]);
  T('لإتمامه/ا لعبة الخرائط التفاعلية في درس',640,40,C.text,600);T(CFG.certLesson,715,46,C.lesson,900);
  T(`وحصوله/ا على ${AR(stars)} من ${AR(MAXS())} نجمة و${AR(score)} نقطة.`,800,38,C.text,600);T(g.split('،')[0],870,42,C.title,800);
  x.font=`700 28px ${F}`;const names=CFG.certChips;let rows=[[]],ws=0;names.forEach(n=>{const w=x.measureText(n).width+44;if(ws+w>1200){rows.push([]);ws=0}rows[rows.length-1].push([n,w]);ws+=w+12});
  rows.forEach((r,i)=>{const tot=r.reduce((a,b)=>a+b[1]+12,-12);let px=W/2+tot/2;r.forEach(([n,w])=>{px-=w;x.fillStyle=C.chip;x.beginPath();x.roundRect?x.roundRect(px,935+i*54,w,42,21):x.rect(px,935+i*54,w,42);x.fill();x.fillStyle=C.chipText;x.fillText(n,px+w/2,957+i*54);px-=12})});
  x.font=`800 30px ${F}`;x.fillStyle=C.text;x.fillText('إعداد: أ. عهود العبرية - مدرسة وادي غول للتعليم الأساسي (1-9)',W/2,1042+(rows.length>1?40:0));
  cv.toBlob(b=>{if(!b){toast('تعذّر الحفظ','bad');return}const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='شهادة-مستكشف.png';document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(u)},4000);toast('تم حفظ الشهادة ✅','ok')},'image/png');
}
function start(){$('intro').classList.add('hidden');Q=QS.slice();qi=0;stars=0;score=0;build();measure();fit(true);showQ()}
const cv=$('confetti'),cx=cv.getContext('2d');let cps=[],craf=0;
function sizeCv(){cv.width=innerWidth;cv.height=innerHeight}
function confettiBurst(x,y,n){for(let i=0;i<n;i++)cps.push({x,y,vx:(Math.random()-.5)*12,vy:-Math.random()*10-2,w:6+Math.random()*6,h:4+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:CFG.confetti[i%CFG.confetti.length],life:1});if(!craf)craf=requestAnimationFrame(cstep)}
function cstep(){cx.clearRect(0,0,cv.width,cv.height);cps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.22;p.r+=p.vr;p.life-=.01;cx.save();cx.globalAlpha=Math.max(0,p.life);cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()});cps=cps.filter(p=>p.life>0&&p.y<cv.height+30);if(cps.length)craf=requestAnimationFrame(cstep);else{craf=0;cx.clearRect(0,0,cv.width,cv.height)}}
$('startBtn').onclick=()=>{sfx.click();start()};
$('muteBtn').onclick=()=>{muted=!muted;$('muteBtn').textContent=muted?'🔇':'🔊'};
function sizeStage(){const r=wrap.getBoundingClientRect(),ar=BOX[2]/BOX[3];let w=r.width,h=w/ar;if(h>r.height){h=r.height;w=h*ar}stage.style.width=Math.floor(w)+'px';stage.style.height=Math.floor(h)+'px'}
new ResizeObserver(()=>{sizeStage();measure();applyCam()}).observe(wrap);addEventListener('resize',()=>{measure();sizeCv()});
sizeStage();build();measure();sizeCv();fit(true);
window.__t={QS,qi:()=>qi,start,stars:()=>stars,phase:()=>phase,judgeRoute,sc:(lo,la)=>{const p=new DOMPoint(PX(lo),PY(la)).matrixTransform(svg.getScreenCTM());return[p.x,p.y]},cam:()=>({...cam}),toLL};
})();
